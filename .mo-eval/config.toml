language = "typescript"

# No path here: the order appends the exact test file, and a directory named alongside it makes
# vitest collect that directory too.
test_command = "npx vitest run --coverage=false"

repo = "honojs/hono"   # this is a fork; its merged pull requests are upstream's

# node, not bun — and the reason is not obvious. A worker needs git (mo-eval reads the agent's
# change with `git diff`) and no public bun image has it. It does not need bun: vendoring runs
# here, at packaging time, where there IS a network, and `node_modules` IS the install, so the
# worker only has to run vitest from the frozen tree with node.
worker_image = "node:22-bookworm@sha256:dd5847a04b0deee391fa145f1f4c6d214196668b6bcc7988ebed67249f226844"

# Declared even though `node_modules` IS the install, because the two stages happen at different
# times. Validation runs the repository's tests in the CI job, BEFORE any vendoring — vendoring is a
# packaging step — so without this the exported workspace has no `node_modules` and every probe fails
# with `Cannot find package 'vitest'`, which reads as a repository whose own tests do not pass.
# It never reaches a worker: the TypeScript contract declares `vendoring_replaces_setup`, so the
# bundle's manifest omits `setup:` and the frozen `node_modules` is what the worker runs from.
# ONE command, no `&&`: a setup command is `shlex.split` and executed directly, with no shell,
# while `offline_prepare` below runs through `sh -c`. The two fields do not read the same, and
# the failure does not say so — npm reports `&" of package "&&": Tags may not have any
# characters that encodeURIComponent encodes`, which names nothing about shells.
setup_command = "npx --yes bun install --frozen-lockfile"

# Install the package manager, then use it. bun is this repository's manager (`bun.lock`), and
# `npm install` cannot resolve a bun workspace at all — measured: `Cannot read properties of null
# (reading 'edgesOut')`. The global install is why the worker image needs no bun of its own.
offline_prepare = "npx --yes bun install --frozen-lockfile"
offline_artifacts = ["node_modules"]
