name: mo-eval suite
on:
  workflow_dispatch:
    inputs:
      arms:
        description: Models to evaluate, space-separated ("none" = build the suite only)
        default: "none"
      candidates:
        description: >-
          How many candidates to request source for. Kept low: this repository's `node_modules` is
          811 MB, and every task's bundle carries a copy of it (#4271, #4277).
        default: "4"
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: momentohq/mo-eval-action@v1
        with:
          arms: ${{ inputs.arms }}
          candidates: ${{ inputs.candidates }}
